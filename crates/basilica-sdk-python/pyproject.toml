[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "basilica-sdk"
version = "0.36.0"
description = "Python SDK for deploying containerized applications on the Basilica GPU cloud"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Basilica Team", email = "team@basilica.ai" }]
requires-python = ">=3.10"
keywords = [
  "gpu",
  "cloud",
  "deployment",
  "basilica",
  "compute",
  "kubernetes",
  "ml",
  "ai",
  "machine-learning",
  "deep-learning",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "httpx>=0.27,<1",
  "mypy>=1.0",
  "maturin>=1.0",
  "pip-audit>=2.10.1,<3",
]
# The BYOT publisher path (#1666): BF16 diff/digest + safetensors anchors +
# direct-to-customer-bucket upload. Deliberately NOT base dependencies —
# the base SDK stays zero-dependency; these load lazily inside
# basilica.publisher and only trainer-side callers need them.
publisher = [
  "torch>=2.1",
  "numpy>=1.24",
  "xxhash>=3.4",
  "zstandard>=0.22",
  "safetensors>=0.4",
  "boto3>=1.34",
]

[project.urls]
Homepage = "https://basilica.ai"
Documentation = "https://docs.basilica.ai"
Repository = "https://github.com/one-covenant/basilica"
Issues = "https://github.com/one-covenant/basilica/issues"
Changelog = "https://github.com/one-covenant/basilica/blob/main/crates/basilica-sdk-python/CHANGELOG.md"

[tool.uv]
exclude-newer = "7 days"

# The publisher extra's torch resolves from the CPU index for THIS
# project's own environments (dev + CI): every publisher op is CPU-side
# (bf16 diff/digest on host tensors), and the CUDA wheel would drag
# multi-GB nvidia/triton dependencies into every locked sync. uv-local
# config only — the published wheel's Requires-Dist stays plain
# `torch>=2.1`, so trainer installs keep whatever torch they already have.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
python-source = "python"
module-name = "basilica._basilica"
